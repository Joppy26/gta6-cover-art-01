<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 6 Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
<style>
  @font-face {
    font-family: 'Anton';
    src: url('./fonts/Anton-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
</style>
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>GTA 6 Cover Maker</h1>
    
    <div class="control-group">
      <h3>Layout & Size</h3>
      <select id="size-preset">
        <option value="1080x1080">Square (1080x1080)</option>
        <option value="1080x1350">Portrait (1080x1350)</option>
        <option value="1920x1080">Landscape (1920x1080)</option>
      </select>
    </div>

    <div class="control-group">
      <h3>Photos</h3>
      <div class="panel-control">
        <label>Panel 1 (Hero) <input id="photo1" type="file" accept="image/*"></label>
        <input id="zoom1" type="range" min="0.1" max="3" step="0.01" value="1">
      </div>
      <div class="panel-control">
        <label>Panel 2 <input id="photo2" type="file" accept="image/*"></label>
        <input id="zoom2" type="range" min="0.1" max="3" step="0.01" value="1">
      </div>
      <div class="panel-control">
        <label>Panel 3 <input id="photo3" type="file" accept="image/*"></label>
        <input id="zoom3" type="range" min="0.1" max="3" step="0.01" value="1">
      </div>
      <button id="reset-photos">Reset Positions</button>
    </div>

    <div class="control-group">
      <h3>Caption</h3>
      <input id="caption" type="text" maxlength="40" value="VICE CITY" placeholder="Enter caption...">
    </div>

    <div class="control-group">
      <h3>Color Grade</h3>
      <label><input type="radio" name="grade" value="sunset" checked> Sunset</label>
      <label><input type="radio" name="grade" value="neon"> Neon</label>
      <label><input type="radio" name="grade" value="none"> None</label>
    </div>

    <button id="export" class="primary-button" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  
  <div class="preview-container">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
